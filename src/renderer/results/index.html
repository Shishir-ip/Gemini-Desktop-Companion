<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; script-src 'self'"
    />
    <title>Circle to Search</title>
    <link rel="stylesheet" href="../shared/glass.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="panel-card" class="glass-card anim-fade-up">
      <header class="head-row">
        <img id="crop-thumb" alt="Selected region" draggable="false" />
        <div class="head-text">
          <span class="title">Circle to Search</span>
          <span id="status" class="status">Reading the selection…</span>
        </div>
        <button id="btn-close" class="icon-btn" title="Close (Esc)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </header>

      <div id="body" tabindex="0"></div>

      <footer class="foot-row">
        <span class="foot-hint">Esc to close</span>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
