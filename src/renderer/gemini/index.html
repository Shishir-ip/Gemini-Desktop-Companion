<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; script-src 'self'"
    />
    <title>Hold to Gemini</title>
    <link rel="stylesheet" href="../shared/glass.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="wrap">
      <div id="stack">
        <!-- Chat sheet: expands above the pill once a conversation exists -->
        <section id="chat-sheet" hidden>
          <div class="sheet-top">
            <img src="/icon.png" alt="" class="sheet-logo" draggable="false" />
            <span class="sheet-title">Gemini</span>
            <span id="api-dot" class="login-dot unknown" title="Checking Gemini connection…"></span>
            <span class="spacer"></span>
            <button id="btn-settings" class="icon-btn" title="Settings">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
            <button id="btn-newchat" class="action-pill" title="Start a new chat">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              New Chat
            </button>
            <button id="btn-minimize" class="action-pill" title="Minimize to taskbar — chat persists">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              Minimise
            </button>
            <button id="btn-close" class="icon-btn close-x" title="Close chat (Esc)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>

          <div id="messages"></div>

          <div id="thinking" class="thinking-row" hidden>
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span id="thinking-detail">Thinking…</span>
            <span id="stream-cursor" hidden></span>
          </div>

          <div id="error-box" hidden>
            <div id="error-title">Something went wrong</div>
            <div id="error-message"></div>
            <div class="error-actions">
              <button id="error-signin" class="glass-btn glass-btn-primary" hidden>Connect Gemini</button>
              <button id="error-opengemini" class="glass-btn" hidden>Open Gemini</button>
              <button id="error-retry" class="glass-btn">Retry</button>
            </div>
          </div>
        </section>

        <!-- Quick actions: empty chat, or right after attaching a capture -->
        <div id="quick-actions" hidden>
          <button class="qa-chip" data-qa="explain">Explain</button>
          <button class="qa-chip" data-qa="summarize">Summarize</button>
          <button class="qa-chip" data-qa="translate">Translate</button>
          <button class="qa-chip" data-qa="solve">Solve</button>
          <button class="qa-chip" data-qa="code">Write code</button>
        </div>

        <!-- Connect banner (no API key yet) -->
        <div id="api-banner" hidden>
          <div class="signin-text">
            <span class="signin-title">Connect Gemini to start asking</span>
            <span class="signin-sub">Free API key from Google AI Studio — paste it below.</span>
            <div class="key-row">
              <input id="api-key-input" type="password" placeholder="AIza…" spellcheck="false" autocomplete="off" />
              <button id="btn-save-key" class="glass-btn glass-btn-primary">Connect</button>
            </div>
            <span id="api-key-status" class="key-status" hidden></span>
          </div>
          <button id="btn-getkey" class="glass-btn">Get a free key</button>
        </div>

        <!-- Attached capture -->
        <div id="attachment-chip" hidden>
          <img id="attachment-thumb" alt="Attached screenshot" draggable="false" />
          <div class="attachment-meta">
            <span class="attachment-name">Screen selection</span>
            <span id="attachment-size" class="text-tertiary"></span>
          </div>
          <button id="btn-remove-attachment" class="icon-btn small" title="Remove attachment">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <!-- The pill -->
        <div id="pill">
          <button id="btn-attach" class="pill-plus" title="Capture a screen region">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <textarea id="prompt" rows="1" placeholder="Ask Gemini" spellcheck="false"></textarea>
          <div class="pill-models">
            <button id="chip-38" class="model-chip" data-model="gemini-3.6-flash">3.6 Flash</button>
            <button id="chip-35" class="model-chip" data-model="gemini-3.5-flash-lite">3.5 Lite</button>
          </div>
          <button id="btn-send" class="send-btn" title="Send (Enter)" disabled>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
