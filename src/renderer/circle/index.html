<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; script-src 'self'"
    />
    <title>Circle to Search</title>
    <link rel="stylesheet" href="../shared/glass.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <img id="shot" alt="" draggable="false" />
    <div id="dim"></div>
    <div id="hint" class="anim-fade-in">
      <span class="hint-icon">⌖</span>
      <span>Drag to select anything on screen</span>
      <span class="hint-sep">·</span>
      <span class="text-secondary">Esc to cancel</span>
    </div>
    <div id="lens-hint" class="anim-fade-in">
      Results are open on the right — click anywhere here to dismiss
    </div>
    <div id="sel" hidden>
      <div id="sel-box">
        <div id="sel-dim-corners"></div>
      </div>
      <div id="sel-badge" hidden>0 × 0</div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
