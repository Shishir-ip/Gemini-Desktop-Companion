<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'"
    />
    <title>Google Lens</title>
    <link rel="stylesheet" href="../shared/glass.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="shell">
      <!-- Loading state -->
      <div id="loading" class="state anim-fade-in">
        <img src="/icon.png" alt="" class="logo anim-fade-up" draggable="false" />
        <div class="spinner"></div>
        <div class="label">Uploading to Google Lens…</div>
      </div>

      <!-- Error state -->
      <div id="error" class="state" hidden>
        <div class="error-icon">⚠️</div>
        <div class="label strong">Couldn't reach Google Lens</div>
        <div class="label sub">
          The upload failed. Check your connection and try again, or open Lens in your browser.
        </div>
        <div class="actions">
          <button id="btn-retry" class="glass-btn glass-btn-primary">Try again</button>
          <button id="btn-external" class="glass-btn">Open Lens</button>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
